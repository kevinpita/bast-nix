name: Check for Updates

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Specific version to update to'
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  check-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          determinate: false
          github-token: ''
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Check for new version
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          CURRENT_VERSION=$(sed -n 's/.*version = "\([^"]*\)".*/\1/p' package.nix | head -1)
          echo "Current version: $CURRENT_VERSION"

          if [ -n "$REQUESTED_VERSION" ]; then
            LATEST_VERSION="$REQUESTED_VERSION"
          else
            LATEST_VERSION=$(gh api repos/ellipse-software/bast/releases/latest --jq '.tag_name' | sed 's/^v//')
          fi

          if [[ ! "$LATEST_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid latest version: $LATEST_VERSION" >&2
            exit 1
          fi

          echo "Latest version: $LATEST_VERSION"

          if [ "$CURRENT_VERSION" != "$LATEST_VERSION" ]; then
            {
              echo "new_version=$LATEST_VERSION"
              echo "current_version=$CURRENT_VERSION"
              echo "update_needed=true"
            } >> "$GITHUB_OUTPUT"
          else
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update version
        if: steps.check.outputs.update_needed == 'true'
        env:
          TARGET_VERSION: ${{ steps.check.outputs.new_version }}
        run: ./scripts/update.sh --version "$TARGET_VERSION"

      - name: Create Pull Request
        if: steps.check.outputs.update_needed == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            package.nix
            flake.lock
          commit-message: "chore: update Bast to version ${{ steps.check.outputs.new_version }}"
          committer: 'Kevin Pita <gitkevin@pm.me>'
          author: 'Kevin Pita <gitkevin@pm.me>'
          title: "chore: update Bast to version ${{ steps.check.outputs.new_version }}"
          body: |
            ## Update Bast

            This PR updates Bast from version ${{ steps.check.outputs.current_version }} to ${{ steps.check.outputs.new_version }}.

            ### Changes
            - Updated `version` in `package.nix`
            - Updated source and Go dependency hashes
            - Updated `flake.lock`

            ---
            This PR was automatically generated by the update workflow.
          branch: update-bast-${{ steps.check.outputs.new_version }}
          delete-branch: true
          labels: |
            dependencies
            automated

      - name: Enable Auto-Merge
        if: steps.check.outputs.update_needed == 'true' && steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --auto --squash --delete-branch --author-email gitkevin@pm.me

      - name: Summary
        if: always()
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          UPDATE_NEEDED: ${{ steps.check.outputs.update_needed }}
          CURRENT_VERSION: ${{ steps.check.outputs.current_version }}
          NEW_VERSION: ${{ steps.check.outputs.new_version }}
        run: |
          {
            echo "## Update Summary"
            echo ""

            if [ "$CHECK_OUTCOME" != "success" ]; then
              echo "Update check failed. See the workflow log for details."
            elif [ "$UPDATE_NEEDED" = "true" ]; then
              echo "- Current Version: $CURRENT_VERSION"
              echo "- Latest Version: $NEW_VERSION"
              echo ""
              echo "Pull request created. Auto-merge was attempted when supported."
            else
              CURRENT_VERSION=$(sed -n 's/.*version = "\([^"]*\)".*/\1/p' package.nix | head -1)
              echo "- Current Version: $CURRENT_VERSION"
              echo ""
              echo "Already up to date."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
